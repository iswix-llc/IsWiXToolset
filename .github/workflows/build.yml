name: CI (v7)

# Builds and tests every push to and pull request into release/* branches, unsigned.
# Releases (signing and nuget.org) are done by publish.yml on main, which builds this branch.

on:
  push:
    branches:
      - release/*
  pull_request:
    branches:
      - release/*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build:
    # Every job does the whole build, then runs a single suite of the slow end-to-end tests (WixE2ESuite,
    # see src/test/test.cmd). The three suites take about 18 (burn), 12 (msi) and 1 (rest) minutes, so
    # running them side by side makes the run roughly as long as the build plus the burn suite. The "rest"
    # job also produces everything that is only needed once: packages and the inputs for the Linux job.
    name: Build and test (${{ matrix.suite }})
    runs-on: windows-2022 # WiX v7 builds with VS2022 (v143 toolset).
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        suite: [rest, burn, msi]
    env:
      # Never an official WiX build. Kept set (to "false") because some tests, such as the Firewall
      # extension's, turn on MSI validation whenever this variable is present.
      WixOfficialBuild: false
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SomeVer needs the tags and history to compute the version.

      - name: Configure automated logging and crash dumps
        shell: cmd
        run: |
          reg add HKLM\Software\Policies\Microsoft\Windows\Installer /t REG_SZ /v Logging /d voicewarmupx /f
          reg add HKLM\Software\WOW6432Node\Policies\Microsoft\Windows\Installer /t REG_SZ /v Logging /d voicewarmupx /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_EXPAND_SZ /v DumpFolder /d "%CD%\build\logs\crashdumps" /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_DWORD /v DumpCount /d 10 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_DWORD /v DumpType /d 1 /f
          reg add "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_EXPAND_SZ /v DumpFolder /d "%CD%\build\logs\crashdumps" /f
          reg add "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_DWORD /v DumpCount /d 10 /f
          reg add "HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\Windows Error Reporting\LocalDumps" /t REG_DWORD /v DumpType /d 1

      - name: Build and test
        shell: cmd
        run: ./src/build_official.cmd
        env:
          RuntimeTestsEnabled: true
          WixE2ESuite: ${{ matrix.suite }}

      # The Linux job below runs the cross-platform integration tests against this build's output.
      - name: Save test binaries for the Linux job
        if: ${{ !cancelled() && matrix.suite == 'rest' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-inputs
          path: build/wix/Release/test/WixToolsetTest.CoreIntegration/net8.0/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      # Second pass over the cross-platform tests with the managed MSI and cabinet backends (the ones used on
      # Linux and macOS). The tests then read the packages back with the real msi.dll, so this also proves the
      # managed output is accepted by Windows Installer.
      - name: Test cross-platform tests with managed backends
        if: ${{ !cancelled() && matrix.suite == 'rest' }}
        shell: cmd
        env:
          WIX_MANAGED_MSI: 1
          WIX_MANAGED_CAB: 1
        run: >
          dotnet test build\wix\Release\test\WixToolsetTest.CoreIntegration\net8.0\WixToolsetTest.CoreIntegration.dll
          --filter "Platform=CrossPlatform"
          --results-directory build\logs\managed-results
          --logger "trx;LogFileName=windows-managed-crossplatform.trx"
          --logger "console;verbosity=normal"

      - name: Save Core.Native test binaries for the Linux job
        if: ${{ !cancelled() && matrix.suite == 'rest' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-inputs-native
          path: build/wix/Release/test/WixToolsetTest.Core.Native/net8.0/win-x64/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - name: Save extension test binaries for the Linux job
        if: ${{ !cancelled() && matrix.suite == 'rest' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-inputs-ext
          path: build/*.wixext/Release/net8.0/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

      - name: Validate test results
        shell: cmd
        run: 7z a build\testresults.zip @src\testresultfilelist.txt

      # Unsigned development build of the packages, for trying out a commit.
      - name: Save build
        if: ${{ matrix.suite == 'rest' }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: build/artifacts/

      - name: Collect integration test logs
        if: ${{ !cancelled() }}
        shell: cmd
        run: 7z a "build\logs\test_burn_%GITHUB_RUN_ID%.zip" "%TEMP%\*.log" "%TEMP%\..\*.log"

      - name: Export Application event log
        if: ${{ !cancelled() }}
        shell: cmd
        run: wevtutil epl Application build\logs\Application.evtx /q:"Event/System/TimeCreated[timediff(@SystemTime) <= 86400000]"

      - name: Export System event log
        if: ${{ !cancelled() }}
        shell: cmd
        run: wevtutil epl System build\logs\System.evtx /q:"Event/System/TimeCreated[timediff(@SystemTime) <= 86400000]"

      # Safe to upload: this job has no secrets and no id-token permission.
      - name: Save logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: logs_${{ github.run_id }}_${{ matrix.suite }}
          path: build/logs/

  test-linux:
    # Runs the tests tagged Platform=CrossPlatform on Linux, using the managed MSI and cabinet backends
    # (no msi.dll). The binaries come from the Windows job because the native projects need MSVC.
    name: Test on Linux
    needs: build
    if: ${{ !cancelled() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-test-inputs
          path: linux-tests

      - name: Download Core.Native test binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-test-inputs-native
          path: linux-tests-native

      - name: Run cross-platform tests
        run: >
          dotnet test linux-tests/WixToolsetTest.CoreIntegration.dll
          --filter "Platform=CrossPlatform"
          --results-directory linux-results
          --logger "trx;LogFileName=linux-crossplatform.trx"
          --logger "console;verbosity=normal"

      - name: Run cross-platform Core.Native tests (cabinets, LZX)
        run: >
          dotnet test linux-tests-native/WixToolsetTest.Core.Native.dll
          --filter "Platform=CrossPlatform"
          --results-directory linux-results
          --logger "trx;LogFileName=linux-crossplatform-native.trx"
          --logger "console;verbosity=normal"

      - name: Download extension test binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-test-inputs-ext
          path: linux-tests-ext

      # The extension tests are MSTest.Sdk executables (Microsoft.Testing.Platform), not VSTest assemblies,
      # so they are run directly. Only tests tagged TestCategory=CrossPlatform run; the others still need
      # msi.dll to read the built package back.
      - name: Run cross-platform extension tests
        run: |
          status=0
          for d in linux-tests-ext/*.wixext/Release/net8.0/WixToolsetTest.*.dll; do
            echo "=== $d"
            dotnet "$d" --filter "TestCategory=CrossPlatform" --results-directory linux-results --report-trx --report-trx-filename "linux-ext-$(basename "$d" .dll).trx" || rc=$?
            # Exit code 8 means no test in this project matched the filter (nothing is tagged there yet).
            if [ "${rc:-0}" -ne 0 ] && [ "$rc" -ne 8 ]; then status=$rc; fi; rc=0
          done
          exit $status

      - name: Save Linux test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-results
          path: linux-results/
